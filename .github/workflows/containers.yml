name: Container images

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed images (requires public source, enabled publishing, and green default-branch CI/audit)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# A rerun has a new attempt number and therefore never reuses an image tag.
# Do not cancel a publisher halfway through signing/attesting an uploaded image.
concurrency:
  group: containers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build ${{ matrix.target }} without publishing
    if: github.event_name == 'pull_request' || !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [app, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          provenance: false
          sbom: false
          cache-from: type=gha,scope=validate-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=validate-${{ matrix.target }}

  authorize-publish:
    name: Check publication prerequisites
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # No checkout or untrusted build executes in this gate.
      - name: Require explicit enablement, public source, default branch, and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_ENABLED: ${{ vars.CONTAINER_PUBLISH_ENABLED }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLISH_ENABLED" == true ]] || { echo '::error::Set the repository variable CONTAINER_PUBLISH_ENABLED=true only after the distribution audit is complete.'; exit 1; }
          [[ "$REPOSITORY_VISIBILITY" == public ]] || { echo '::error::Publication requires public source; keyless signing records the workflow identity in public transparency logs.'; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo '::error::Publish only from the default branch.'; exit 1; }
          for workflow in ci.yml publication-audit.yml; do
            conclusion=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')
            [[ "$conclusion" == success ]] || { echo "::error::The latest push run of $workflow for this exact commit must succeed before publishing."; exit 1; }
          done

  publish:
    name: Publish and verify ${{ matrix.target }}
    needs: authorize-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: container-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [app, web]
    steps:
      - name: Check out the authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve immutable image reference
        id: image
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-$TARGET"
          tag="sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$tag" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/image-evidence"

      - name: Set up Node.js for the image gate
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable the containerd image store to retain attestations locally
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.6.1
          # Trivy's Docker client must use this daemon as well as the Docker CLI.
          set-host: true
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load with BuildKit provenance and SPDX SBOM
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          # Build once. The same local index is scanned and then pushed, without
          # a second build or loss of its provenance/SBOM attestation manifests.
          push: false
          load: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          # Never consume a PR's cache in a job with registry/OIDC authority.
          cache-from: type=gha,scope=publish-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.target }}

      - name: Install checksum-pinned Trivy
        run: node scripts/publication/install-tools.mjs "$RUNNER_TEMP/publication-tools" trivy

      - name: Gate the immutable local image before upload
        id: gate
        env:
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLICATION_TRIVY: ${{ runner.temp }}/publication-tools/trivy
        shell: bash
        run: |
          set -euo pipefail
          local_digest=$(docker image inspect "$TAG" --format '{{.Descriptor.digest}}')
          [[ "$local_digest" == "$DIGEST" ]] || { echo '::error::Loaded image index differs from the BuildKit output.'; exit 1; }
          image_id=$(docker image inspect "$TAG" --format '{{.Id}}')
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          node scripts/publication/image-gate.mjs "$image_id" "$RUNNER_TEMP/image-evidence/security"

      - name: Log in to GHCR after the image passes its gate
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the gated image and confirm its index digest
        env:
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.gate.outputs.image-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(docker image inspect "$TAG" --format '{{.Id}}')" == "$IMAGE_ID" ]]
          [[ "$(docker image inspect "$TAG" --format '{{.Descriptor.digest}}')" == "$DIGEST" ]]
          # Do not pass --platform: that would discard the index/attestations.
          docker push "$TAG"
          remote_digest=$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}')
          [[ "$remote_digest" == "$DIGEST" ]] || { echo '::error::Registry digest differs from the gated local image index.'; exit 1; }

      - name: Extract and validate the final-image SBOM
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST" \
            --format '{{ json .SBOM.SPDX }}' > "$RUNNER_TEMP/image-evidence/sbom.spdx.json"
          jq -e '.SPDXID == "SPDXRef-DOCUMENT" and (.spdxVersion | startswith("SPDX-")) and (.packages | length > 0)' \
            "$RUNNER_TEMP/image-evidence/sbom.spdx.json" > /dev/null

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image digest using GitHub OIDC
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest GitHub build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records require an organization-owned repository. The
          # attestation itself works for both personal and organization owners.
          create-storage-record: false

      - name: Attest the image SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image-evidence/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify identity, source commit, provenance, and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash docker/verify-image.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$DEFAULT_BRANCH" "$IMAGE@$DIGEST"

      - name: Record verified image and attestation bundles
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.image.outputs.tag }}
          IMAGE_ID: ${{ steps.gate.outputs.image-id }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/image-evidence/provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "$RUNNER_TEMP/image-evidence/sbom.sigstore.json"
          jq -n --arg image "$IMAGE@$DIGEST" --arg tag "$TAG" --arg commit "$GITHUB_SHA" --arg localImageId "$IMAGE_ID" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{image: $image, tag: $tag, commit: $commit, localImageId: $localImageId, run: $run}' > "$RUNNER_TEMP/image-evidence/image.json"
          printf 'Verified `%s` image: `%s@%s`\n' "$TARGET" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image evidence
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-evidence/
          if-no-files-found: error
          retention-days: 90
