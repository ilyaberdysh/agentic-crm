name: Bug report
description: Report reproducible behavior that does not match the documented product.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Agentic CRM. Do not include credentials, customer data, or vulnerability details here. Report security issues through the Security tab instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest set of steps or a minimal repository that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      placeholder: Git commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Environment
      options:
        - Local development
        - Self-hosted deployment
        - Test suite
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, tokens, customer data, and generated passwords before pasting logs.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no secrets, customer data, or private vulnerability details.
          required: true
