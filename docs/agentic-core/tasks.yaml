    depends_on: []
    model: gpt-6-luna
    effort: medium
    write_scope: []
    status: done
    acceptance:
      - Exact setup and check commands are recorded with pass/fail evidence.
      - Existing failures are separated from milestone regressions.
      - Follow-up tasks use the integrated base SHA.

  - id: W0-ARCHITECTURE
