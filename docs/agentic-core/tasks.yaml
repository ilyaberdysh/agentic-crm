    depends_on: []
    model: gpt-6.1-sol
    effort: xhigh
    write_scope: []
    status: done
    acceptance:
      - Every packet names concrete seams and acceptance checks.
      - The first vertical slice is visible and credential-free.
      - Speculative framework work is excluded.

