principles:
  - prove one useful end-to-end flow before generalizing
  - reuse existing domain services and UI primitives
  - add abstractions only for a real boundary or two current consumers
  - protect human-authored CRM values
  - keep UI API and MCP on the same policy-brokered capability path
  - capture useful non-blocking work in backlog.yaml instead of expanding an active packet

