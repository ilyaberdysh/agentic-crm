<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agentic CRM</title>
  <desc id="desc">Evidence-backed agent work with policy and human review before a CRM change.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#f3f6fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1170" cy="70" r="260" fill="#2563eb" opacity=".12"/>
  <circle cx="110" cy="620" r="310" fill="#38bdf8" opacity=".08"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="82" y="78" width="46" height="46" rx="14" fill="#60a5fa"/>
    <path d="M96 103h18M105 94v18" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <text x="146" y="109" fill="#cbd5e1" font-size="20" font-weight="650" letter-spacing="2">OPEN-SOURCE CRM PREVIEW</text>
    <text x="82" y="218" fill="#fff" font-size="64" font-weight="760" letter-spacing="-2">Agentic CRM</text>
    <text x="84" y="270" fill="#cbd5e1" font-size="27" font-weight="450">Agents propose useful work.</text>
    <text x="84" y="308" fill="#cbd5e1" font-size="27" font-weight="450">People keep authority.</text>
    <g transform="translate(84 376)">
      <rect width="212" height="54" rx="27" fill="#1e3a8a" stroke="#60a5fa" stroke-opacity=".7"/>
      <text x="106" y="35" fill="#dbeafe" font-size="18" text-anchor="middle" font-weight="650">EVIDENCE FIRST</text>
      <rect x="228" width="196" height="54" rx="27" fill="#164e63" stroke="#67e8f9" stroke-opacity=".65"/>
      <text x="326" y="35" fill="#cffafe" font-size="18" text-anchor="middle" font-weight="650">POLICY CHECK</text>
      <rect x="440" width="204" height="54" rx="27" fill="#14532d" stroke="#86efac" stroke-opacity=".65"/>
      <text x="542" y="35" fill="#dcfce7" font-size="18" text-anchor="middle" font-weight="650">HUMAN REVIEW</text>
    </g>
    <g filter="url(#shadow)" transform="translate(792 100)">
      <rect width="404" height="440" rx="24" fill="url(#card)"/>
      <rect x="0" y="0" width="404" height="62" rx="24" fill="#fff"/>
      <path d="M0 62h404" stroke="#e2e8f0"/>
      <circle cx="30" cy="31" r="6" fill="#f87171"/><circle cx="51" cy="31" r="6" fill="#fbbf24"/><circle cx="72" cy="31" r="6" fill="#4ade80"/>
      <text x="103" y="37" fill="#64748b" font-size="15" font-weight="600">NORTHWIND ROBOTICS</text>
      <text x="30" y="105" fill="#0f172a" font-size="14" font-weight="700" letter-spacing="1.1">SOURCE EVIDENCE</text>
      <rect x="30" y="121" width="344" height="82" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
      <rect x="46" y="142" width="5" height="40" rx="2.5" fill="#3b82f6"/>
      <text x="64" y="153" fill="#1e3a8a" font-size="17" font-weight="500">“Can we create a follow-up</text>
      <text x="64" y="179" fill="#1e3a8a" font-size="17" font-weight="500">task for the warehouse rollout?”</text>
      <text x="30" y="242" fill="#0f172a" font-size="14" font-weight="700" letter-spacing="1.1">PROPOSED ACTION</text>
      <rect x="30" y="258" width="344" height="63" rx="12" fill="#fff" stroke="#e2e8f0"/>
      <circle cx="58" cy="289" r="14" fill="#dbeafe"/>
      <path d="M52 289h12M58 283v12" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
      <text x="84" y="286" fill="#0f172a" font-size="16" font-weight="650">Create CRM task</text>
      <text x="84" y="305" fill="#64748b" font-size="13">Review warehouse rollout plan</text>
      <rect x="30" y="345" width="344" height="63" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
      <circle cx="58" cy="376" r="14" fill="#bbf7d0"/>
      <path d="m52 376 4 4 8-9" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="373" fill="#166534" font-size="16" font-weight="700">Approved · receipt saved</text>
      <text x="84" y="392" fill="#15803d" font-size="13">Exact change recorded in the audit trail</text>
    </g>
    <text x="84" y="572" fill="#64748b" font-size="18">Evidence-backed actions · Explicit policy · Durable receipts</text>
  </g>
</svg>
